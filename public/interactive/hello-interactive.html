<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        padding: 1rem;
        max-width: 52rem;
      }
      code {
        padding: 0.1rem 0.3rem;
        border-radius: 0.35rem;
        background: color-mix(in srgb, CanvasText 10%, Canvas);
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Standalone interactive HTML blog demo</h1>
      <p>
        This file lives in <code>public/interactive/hello-interactive.html</code> and can be embedded in a Markdown
        blog with an iframe.
      </p>
      <label for="a"><strong>a</strong> value</label>
      <input id="a" type="range" min="0" max="100" value="20" />
      <p id="result" aria-live="polite"></p>
    </main>

    <script>
      const slider = document.getElementById("a");
      const result = document.getElementById("result");

      function update() {
        const value = Number(slider.value);
        result.textContent = `f(a) = a² + 2a = ${value * value + 2 * value}`;
      }

      slider.addEventListener("input", update);
      update();
    </script>
  </body>
</html>
